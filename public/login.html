<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguard Recon — Sign In</title>
    <meta name="description" content="Authentication gateway for Vanguard Recon Security Assessment Suite.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            position: relative;
            z-index: 1;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            padding: 36px 32px;
            position: relative;
            overflow: hidden;
            animation: fadeInScale 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: translateY(12px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-brand-icon {
            width: 48px;
            height: 48px;
            background: #09090b;
            color: #fff;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .auth-brand-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .auth-title {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .auth-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.06);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 24px;
        }

        .auth-tab {
            flex: 1;
            padding: 9px 0;
            text-align: center;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .auth-tab.active {
            background: #fff;
            color: var(--text-primary);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
        }

        .form-label {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .auth-input {
            width: 100%;
            background: #fff;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 11px 14px;
            font-family: inherit;
            font-size: 13.5px;
            color: var(--text-primary);
            outline: none;
            transition: var(--transition-smooth);
        }

        .auth-input:focus {
            border-color: #09090b;
            box-shadow: 0 0 0 3px rgba(9, 9, 11, 0.08);
        }

        .pwd-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            padding: 4px;
        }

        .auth-error-banner {
            display: none;
            background: rgba(220, 38, 38, 0.08);
            border: 1px solid rgba(220, 38, 38, 0.25);
            color: var(--sev-critical);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            font-weight: 600;
            margin-bottom: 16px;
            align-items: center;
            gap: 8px;
        }

        .auth-error-banner.show {
            display: flex;
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <div id="toastNotification" class="toast-card">
        <span id="toastIcon">✓</span>
        <span id="toastMsg">Action completed</span>
    </div>

    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-brand-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </div>
                <h1 class="auth-title">VANGUARD RECON</h1>
                <p class="auth-subtitle">Security Assessment & Vulnerability Management</p>
            </div>

            <!-- Login / Register Tab switcher -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tabLoginBtn">Sign In</button>
                <button type="button" class="auth-tab" id="tabRegisterBtn">Create Account</button>
            </div>

            <!-- Error Banner -->
            <div id="authErrorBanner" class="auth-error-banner">
                <span id="authErrorMsg">Invalid username or password</span>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label class="form-label" for="loginIdentifier">Username or Email</label>
                    <div class="input-wrapper">
                        <input type="text" id="loginIdentifier" class="auth-input" placeholder="Enter username or email" required autofocus autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">
                        <span>Password</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="password" id="loginPassword" class="auth-input" placeholder="Enter password" required autocomplete="current-password">
                        <button type="button" class="pwd-toggle" id="toggleLoginPwd" title="Toggle password visibility">Show</button>
                    </div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; font-size:12.5px; margin-top:2px;">
                    <label style="display:flex; align-items:center; gap:6px; cursor:pointer; color:var(--text-secondary); font-weight:500;">
                        <input type="checkbox" id="rememberMe" checked style="accent-color:#09090b;">
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn-primary" style="width:100%; justify-content:center; padding:12px; font-size:14px; margin-top:6px;">
                    Sign In
                </button>
            </form>

            <!-- REGISTER FORM (Hidden by default) -->
            <form id="registerForm" class="auth-form" style="display:none;">
                <div class="form-group">
                    <label class="form-label" for="regFullName">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="regFullName" class="auth-input" placeholder="e.g. Alex Miller">
                    </div>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                    <div class="form-group">
                        <label class="form-label" for="regUsername">Username</label>
                        <div class="input-wrapper">
                            <input type="text" id="regUsername" class="auth-input" placeholder="username" required autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="regRole">Role / Title</label>
                        <div class="input-wrapper">
                            <input type="text" id="regRole" class="auth-input" placeholder="Security Analyst">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regEmail">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="regEmail" class="auth-input" placeholder="user@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regOrg">Organization</label>
                    <div class="input-wrapper">
                        <input type="text" id="regOrg" class="auth-input" placeholder="Organization / Institution">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regPassword">Password (min 6 characters)</label>
                    <div class="input-wrapper">
                        <input type="password" id="regPassword" class="auth-input" placeholder="Password" required minlength="6" autocomplete="new-password">
                        <button type="button" class="pwd-toggle" id="toggleRegPwd" title="Toggle password visibility">Show</button>
                    </div>
                </div>

                <button type="submit" id="registerSubmitBtn" class="btn-primary" style="width:100%; justify-content:center; padding:12px; font-size:14px; margin-top:6px;">
                    Create Account
                </button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check if already authenticated
            if (VanguardAuth.isAuthenticated()) {
                window.location.href = 'index.html';
                return;
            }

            // Animated background particle canvas
            const bgCanvas = document.getElementById('bgCanvas');
            if (bgCanvas) {
                const ctx = bgCanvas.getContext('2d');
                let width = bgCanvas.width = window.innerWidth;
                let height = bgCanvas.height = window.innerHeight;
                window.addEventListener('resize', () => {
                    width = bgCanvas.width = window.innerWidth;
                    height = bgCanvas.height = window.innerHeight;
                });

                const particles = [];
                for (let i = 0; i < 120; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: Math.random() * 0.5 + 0.2,
                        size: Math.random() * 1.5 + 0.5,
                        alpha: Math.random() * 0.5 + 0.2
                    });
                }

                function animate() {
                    ctx.clearRect(0, 0, width, height);
                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.y > height) { p.y = -2; p.x = Math.random() * width; }
                        if (p.x < 0) p.x = width;
                        if (p.x > width) p.x = 0;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(20, 20, 25, ${p.alpha})`;
                        ctx.fill();
                    });
                    requestAnimationFrame(animate);
                }
                animate();
            }

            // Tab Switching
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const errorBanner = document.getElementById('authErrorBanner');
            const errorMsg = document.getElementById('authErrorMsg');

            function showError(msg) {
                errorMsg.innerText = msg;
                errorBanner.classList.add('show');
            }
            function hideError() {
                errorBanner.classList.remove('show');
            }

            tabLoginBtn.addEventListener('click', () => {
                tabLoginBtn.classList.add('active');
                tabRegisterBtn.classList.remove('active');
                loginForm.style.display = 'flex';
                registerForm.style.display = 'none';
                hideError();
            });

            tabRegisterBtn.addEventListener('click', () => {
                tabRegisterBtn.classList.add('active');
                tabLoginBtn.classList.remove('active');
                registerForm.style.display = 'flex';
                loginForm.style.display = 'none';
                hideError();
            });

            // Password show/hide toggle
            function setupPwdToggle(toggleBtnId, inputId) {
                const btn = document.getElementById(toggleBtnId);
                const input = document.getElementById(inputId);
                if (btn && input) {
                    btn.addEventListener('click', () => {
                        if (input.type === 'password') {
                            input.type = 'text';
                            btn.innerText = 'Hide';
                        } else {
                            input.type = 'password';
                            btn.innerText = 'Show';
                        }
                    });
                }
            }
            setupPwdToggle('toggleLoginPwd', 'loginPassword');
            setupPwdToggle('toggleRegPwd', 'regPassword');

            // Helper redirect after login
            function redirectPostAuth() {
                const params = new URLSearchParams(window.location.search);
                const returnUrl = params.get('returnUrl');
                if (returnUrl && !returnUrl.includes('login.html')) {
                    window.location.href = returnUrl;
                } else {
                    window.location.href = 'index.html';
                }
            }

            // Login submission
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError();
                const identifier = document.getElementById('loginIdentifier').value.trim();
                const password = document.getElementById('loginPassword').value;
                const remember = document.getElementById('rememberMe').checked;
                const submitBtn = document.getElementById('loginSubmitBtn');

                submitBtn.innerText = 'Signing in...';
                submitBtn.disabled = true;

                const res = await VanguardAuth.login(identifier, password, remember);
                submitBtn.disabled = false;
                submitBtn.innerText = 'Sign In';

                if (res.success) {
                    redirectPostAuth();
                } else {
                    showError(res.error || 'Authentication failed. Please verify credentials.');
                }
            });

            // Register submission
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError();
                const username = document.getElementById('regUsername').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value;
                const fullName = document.getElementById('regFullName').value.trim();
                const role = document.getElementById('regRole').value.trim();
                const org = document.getElementById('regOrg').value.trim();
                const submitBtn = document.getElementById('registerSubmitBtn');

                submitBtn.innerText = 'Creating Account...';
                submitBtn.disabled = true;

                const res = await VanguardAuth.register(username, email, password, fullName, role, org);
                submitBtn.disabled = false;
                submitBtn.innerText = 'Create Account';

                if (res.success) {
                    redirectPostAuth();
                } else {
                    showError(res.error || 'Registration failed. Please check form fields.');
                }
            });

            // Check if expired param present
            const params = new URLSearchParams(window.location.search);
            if (params.get('expired')) {
                showError('Your session has expired. Please sign in again.');
            }
        });
    </script>
</body>
</html>
